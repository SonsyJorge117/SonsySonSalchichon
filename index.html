<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SonsySonSalchichon - Jorge y Sonia</title>
  <style>
    :root {
      --bg-color: #4c8ac5;
      --header-bg: #1362bd;
      --header-text: #0affca;
      --text-main: #ffffff;
      --subtitle-color: #6bff97;
      --pink-accent: #fd00fd;
      --yellow-overlay: #fffb00;
      --yellow-or: #ffee03;
      --hr-color: rgba(247, 242, 242, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--text-main);
      text-align: center;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 10px;
      overflow-x: hidden;
      position: relative;
    }

    /* Collage dinámico de fondo */
    .bg-collage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 2px;
      z-index: 0;
      filter: blur(4px) brightness(0.4);
      transform: scale(1.05);
      pointer-events: none;
    }

    .bg-collage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Velo de tono azul sobre el collage */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, rgba(91, 155, 214, 0.4) 0%, rgba(76, 138, 197, 0.7) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Canvas para partículas de corazones */
    #hearts-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Contenedor principal estilo Tarjeta App Pro */
    .app-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), 
                  0 0 20px rgba(253, 0, 253, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      animation: floatCard 6s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* Header elegante con icono pulsante */
    .header {
      background: linear-gradient(135deg, var(--header-bg) 0%, #0d488f 100%);
      color: var(--header-text);
      padding: 20px;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1.2px;
      text-shadow: 0 0 10px rgba(10, 255, 202, 0.6);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .heart-icon {
      color: var(--pink-accent);
      animation: pulse 1.5s infinite;
      display: inline-block;
      font-style: normal;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); filter: drop-shadow(0 0 8px var(--pink-accent)); }
      100% { transform: scale(1); }
    }

    /* Contenedor de Imagen */
    .image-container {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .image-container img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      display: block;
      transition: opacity 0.8s ease-in-out, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      filter: brightness(0.95);
    }

    .image-container:hover img {
      transform: scale(1.06);
      filter: brightness(1.02);
    }

    .image-overlay-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
      pointer-events: none;
      z-index: 2;
    }

    .date-badge {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 251, 0, 0.4);
      color: var(--yellow-overlay);
      font-style: italic;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 251, 0, 0.7);
      z-index: 3;
      white-space: nowrap;
    }

    .section {
      padding: 24px 20px;
    }

    .subtitle {
      color: var(--subtitle-color);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-shadow: 0 0 10px rgba(107, 255, 151, 0.4);
    }

    .counter-main {
      font-size: 28px;
      font-weight: bold;
      color: var(--pink-accent);
      text-shadow: 0 0 12px rgba(253, 0, 253, 0.6), 2px 2px 4px rgba(0,0,0,0.4);
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .love-quote {
      font-size: 18px;
      font-style: italic;
      color: #ffffff;
      margin-top: 10px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      display: inline-block;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      border: 1px dashed rgba(255, 255, 255, 0.3);
    }

    hr {
      border: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--hr-color), transparent);
      margin: 0 auto;
      width: 85%;
    }

    .counter-details {
      font-size: 19px;
      line-height: 2.2;
      color: var(--pink-accent);
      text-shadow: 0 0 8px rgba(253, 0, 253, 0.4);
    }

    .counter-details p {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .or-text {
      font-size: 14px;
      color: var(--yellow-or);
      font-weight: bold;
      text-shadow: 0 0 6px rgba(255, 238, 3, 0.6);
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .time-box {
      background: rgba(0, 0, 0, 0.25);
      padding: 12px 6px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(253, 0, 253, 0.3);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }

    .time-box:hover {
      transform: translateY(-4px) scale(1.05);
      background: rgba(0, 0, 0, 0.35);
      border-color: var(--pink-accent);
      box-shadow: 0 6px 15px rgba(253, 0, 253, 0.3);
    }

    .time-num {
      font-size: 20px;
      font-weight: bold;
      color: var(--pink-accent);
      text-shadow: 0 0 8px rgba(253, 0, 253, 0.8);
    }

    .time-label {
      font-size: 10px;
      color: var(--subtitle-color);
      font-family: system-ui, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
      font-weight: bold;
    }

    .footer-quote {
      background: linear-gradient(135deg, rgba(19, 98, 189, 0.8) 0%, rgba(13, 72, 143, 0.9) 100%);
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      color: var(--header-text);
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(10, 255, 202, 0.5);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* Botón flotante por si el navegador bloquea el autoplay */
    #music-prompt {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(19, 98, 189, 0.95);
      color: #0affca;
      padding: 12px 18px;
      border-radius: 30px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      border: 1px solid rgba(10, 255, 202, 0.5);
      z-index: 1000;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(5px);
    }

    @media (max-width: 600px) {
      .bg-collage {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(5, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- Reproductor de audio oculto -->
  <audio id="bg-music" loop>
    <source src="kiss.mp3" type="audio/mpeg">
  </audio>

  <!-- Botón interactivo por restricciones de autoplay del navegador -->
  <div id="music-prompt" onclick="playMusic()">
    🎵 Musiquilla :) 💕
  </div>

  <!-- Fondo de Collage Automático -->
  <div class="bg-collage">
    <img src="sonsyson.jpeg" alt="" onerror="this.style.display='none'">
    <img src="l.jpeg" alt="" onerror="this.style.display='none'">
    <img src="m.jpeg" alt="" onerror="this.style.display='none'">
    <img src="n.jpeg" alt="" onerror="this.style.display='none'">
    <img src="o.jpeg" alt="" onerror="this.style.display='none'">
    <img src="p.jpeg" alt="" onerror="this.style.display='none'">
    <img src="q.jpeg" alt="" onerror="this.style.display='none'">
    <img src="r.jpeg" alt="" onerror="this.style.display='none'">
    <img src="sa.jpeg" alt="" onerror="this.style.display='none'">
    <img src="se.jpeg" alt="" onerror="this.style.display='none'">
  </div>
  <div class="bg-overlay"></div>

  <!-- Canvas de Corazones Flotantes -->
  <canvas id="hearts-canvas"></canvas>

  <div class="app-card">
    
    <!-- Encabezado con Icono -->
    <div class="header">
      <span class="heart-icon">❤️</span>
      Jorge y Sonia
      <span class="heart-icon">❤️</span>
    </div>

    <!-- Imagen Principal con Carrusel Automático -->
    <div class="image-container">
      <img id="carousel-image" src="sonsyson.jpeg" alt="Jorge y Sonia">
      <div class="image-overlay-gradient"></div>
      <div class="date-badge">8 de Julio de 2026</div>
    </div>

    <!-- Contador Principal -->
    <div class="section">
      <div class="subtitle">Llevamos juntos:</div>
      <div class="counter-main" id="main-counter">Calculando...</div>
      <p class="love-quote">Te quiero mucho mi vida preciosa 💕</p>
    </div>

    <hr>

    <!-- Sección Desglosada -->
    <div class="section">
      <div class="subtitle">O también:</div>
      <div class="counter-details">
        <p id="counter-months">0 Meses</p>
        <p><span class="or-text">o</span> <span id="counter-weeks">0 Semanas</span></p>
        <p><span class="or-text">o</span> <span id="counter-days">0 Días</span></p>
      </div>

      <!-- Tarjetas Interactivas en Vivo -->
      <div class="time-grid">
        <div class="time-box">
          <span class="time-num" id="tb-days">0</span>
          <span class="time-label">Días</span>
        </div>
        <div class="time-box">
          <span class="time-num" id="tb-hours">0</span>
          <span class="time-label">Horas</span>
        </div>
        <div class="time-box">
          <span class="time-num" id="tb-mins">0</span>
          <span class="time-label">Min</span>
        </div>
        <div class="time-box">
          <span class="time-num" id="tb-secs">0</span>
          <span class="time-label">Seg</span>
        </div>
      </div>
    </div>

    <!-- Cierre Romántico -->
    <div class="footer-quote">
      Quiero estar siempre a tu lado mi amor ❤️
    </div>

  </div>

  <script>
    // --- AUTOPLAY DE MÚSICA ---
    const music = document.getElementById('bg-music');
    const promptBox = document.getElementById('music-prompt');

    music.volume = 0.5; // Volumen al 50%

    // Intentar reproducir automáticamente al cargar
    music.play().catch(() => {
      // Si el navegador lo bloquea, mostramos el botón flotante
      promptBox.style.display = 'flex';
    });

    function playMusic() {
      music.play();
      promptBox.style.display = 'none';
    }


    // --- LISTA EXACTA Y COMPLETA PARA EL CARRUSEL INFINITO ---
    const imagesArray = [
      "sonsyson.jpeg",
      "l.jpeg",
      "m.jpeg",
      "n.jpeg",
      "o.jpeg",
      "p.jpeg",
      "q.jpeg",
      "r.jpeg",
      "sa.jpeg",
      "se.jpeg",
      "si.jpeg",
      "su.jpeg",
      "t.jpeg",
      "u.jpeg",
      "v.jpeg",
      "w.jpeg",
      "y.jpeg",
      "ya.jpeg",
      "z.jpeg"
    ];

    let currentImageIndex = 0;
    const imgElement = document.getElementById('carousel-image');

    function changeImage() {
      imgElement.style.opacity = 0;

      setTimeout(() => {
        currentImageIndex = (currentImageIndex + 1) % imagesArray.length;
        imgElement.src = imagesArray[currentImageIndex];
        imgElement.style.opacity = 1;
      }, 800);
    }

    setInterval(changeImage, 4000);


    // --- LÓGICA DEL CONTADOR DE TIEMPO ---
    const startDate = new Date(2026, 6, 8, 0, 0, 0); // 8 de Julio de 2026

    function updateCounter() {
      const now = new Date();
      let diffMs = now - startDate;

      if (diffMs < 0) {
        document.getElementById('main-counter').innerText = "¡Aún no ha llegado nuestra fecha!";
        return;
      }

      let years = now.getFullYear() - startDate.getFullYear();
      let months = now.getMonth() - startDate.getMonth() + (years * 12);
      let tempDate = new Date(startDate);
      tempDate.setMonth(tempDate.getMonth() + months);

      if (tempDate > now) {
        months--;
        tempDate = new Date(startDate);
        tempDate.setMonth(tempDate.getMonth() + months);
      }

      const diffDaysAfterMonths = Math.floor((now - tempDate) / (1000 * 60 * 60 * 24));

      let mainText = `${months} ${months === 1 ? 'Mes' : 'Meses'}`;
      if (diffDaysAfterMonths > 0) {
        mainText += ` y ${diffDaysAfterMonths} ${diffDaysAfterMonths === 1 ? 'Día' : 'Días'}`;
      }
      document.getElementById('main-counter').innerText = mainText;

      const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const totalWeeks = Math.floor(totalDays / 7);

      document.getElementById('counter-months').innerText = `${months} ${months === 1 ? 'Mes' : 'Meses'}`;
      document.getElementById('counter-weeks').innerText = `${totalWeeks} Semanas`;
      document.getElementById('counter-days').innerText = `${totalDays} Días`;

      const hours = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diffMs / (1000 * 60)) % 60);
      const seconds = Math.floor((diffMs / 1000) % 60);

      document.getElementById('tb-days').innerText = totalDays;
      document.getElementById('tb-hours').innerText = hours;
      document.getElementById('tb-mins').innerText = minutes;
      document.getElementById('tb-secs').innerText = seconds;
    }

    updateCounter();
    setInterval(updateCounter, 1000);


    // --- SISTEMA DE PARTÍCULAS DE CORAZONES ---
    const canvas = document.getElementById('hearts-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class HeartParticle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 50;
        this.size = Math.random() * 12 + 8;
        this.speedY = Math.random() * 1.5 + 0.5;
        this.speedX = Math.sin(Math.random() * Math.PI) * 0.8;
        this.opacity = Math.random() * 0.6 + 0.2;
        this.color = Math.random() > 0.3 ? '#fd00fd' : '#0affca';
      }

      update() {
        this.y -= this.speedY;
        this.x += Math.sin(this.y * 0.01) * 0.5;
        if (this.y < -20) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        ctx.font = `${this.size}px serif`;
        ctx.fillText('♥', this.x, this.y);
        ctx.restore();
      }
    }

    const hearts = Array.from({ length: 30 }, () => new HeartParticle());

    function animateHearts() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hearts.forEach(heart => {
        heart.update();
        heart.draw();
      });
      requestAnimationFrame(animateHearts);
    }

    animateHearts();
  </script>
</body>
</html>
